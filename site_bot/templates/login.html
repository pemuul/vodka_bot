<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — FINSKY ICE</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      integrity="sha512-0yYhCyiMB+6XOis4qvWA42kPkKb54+uMaOhbsta6m+aQ7cZOm5hzERPrRkkknlpEdoxVCwYui+yM0jRazpDFuA=="
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ice-100: #eaf6fb;
        --ice-200: #cdeaf5;
        --ice-500: #2fb6d9;
        --ice-600: #1a94b8;
        --ice-700: #0f6e8c;
        --ink: #16333d;
      }

      html, body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 15% -10%, var(--ice-200) 0%, transparent 60%),
          radial-gradient(900px 500px at 110% 110%, #d7f0f8 0%, transparent 55%),
          linear-gradient(180deg, #f4fbfd 0%, #e7f4f8 100%);
        padding: 1.5rem;
      }

      .login-card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border-radius: 1.25rem;
        box-shadow:
          0 1px 2px rgba(15, 60, 75, 0.06),
          0 20px 45px -15px rgba(15, 110, 140, 0.35);
        padding: 2.25rem 2rem 2rem;
        border: 1px solid rgba(47, 182, 217, 0.15);
      }

      .login-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        margin-bottom: 0.35rem;
      }

      .login-brand-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        border-radius: 0.9rem;
        background: linear-gradient(135deg, var(--ice-500), var(--ice-700));
        color: #fff;
        font-size: 1.4rem;
        box-shadow: 0 8px 18px -6px rgba(26, 148, 184, 0.55);
      }

      .login-brand-text {
        font-weight: 700;
        font-size: 1.25rem;
        letter-spacing: 0.02em;
        color: var(--ice-700);
      }

      .login-subtitle {
        text-align: center;
        color: #5b7986;
        font-size: 0.92rem;
        margin-bottom: 1.75rem;
      }

      .form-floating > label {
        color: #6b8794;
      }

      .form-control {
        border-radius: 0.7rem;
        border-color: #d9ecf1;
        padding-top: 1.1rem;
      }

      .form-control:focus {
        border-color: var(--ice-500);
        box-shadow: 0 0 0 0.2rem rgba(47, 182, 217, 0.2);
      }

      .password-field {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        display: flex;
        align-items: center;
        padding: 0 0.9rem;
        color: #7d99a5;
        background: none;
        border: none;
        cursor: pointer;
        z-index: 5;
      }

      .password-toggle:hover {
        color: var(--ice-700);
      }

      .btn-ice {
        border: none;
        border-radius: 0.7rem;
        padding: 0.65rem 1rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #fff;
        background: linear-gradient(135deg, var(--ice-500), var(--ice-700));
        box-shadow: 0 10px 20px -8px rgba(26, 148, 184, 0.6);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .btn-ice:hover, .btn-ice:focus {
        color: #fff;
        transform: translateY(-1px);
        box-shadow: 0 14px 24px -8px rgba(26, 148, 184, 0.7);
      }

      .btn-ice:active {
        transform: translateY(0);
      }

      .login-error {
        border-radius: 0.7rem;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .login-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: #8aa3ad;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-brand">
        <span class="login-brand-icon"><i class="bi bi-snow2"></i></span>
        <span class="login-brand-text">FINSKY ICE</span>
      </div>
      <p class="login-subtitle">Панель администратора</p>

      {% if error %}
      <div class="alert alert-danger login-error py-2 px-3 mb-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post" action="/login" novalidate>
        <input type="hidden" name="next" value="{{ next }}" />

        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Имя пользователя"
            autocomplete="username"
            required
            autofocus
          />
          <label for="username">Имя пользователя</label>
        </div>

        <div class="form-floating mb-4 password-field">
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Пароль"
            autocomplete="current-password"
            required
          />
          <label for="password">Пароль</label>
          <button type="button" class="password-toggle" id="togglePassword" tabindex="-1" aria-label="Показать пароль">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>

        <button type="submit" class="btn btn-ice w-100">
          Войти <i class="bi bi-arrow-right-short"></i>
        </button>
      </form>
    </div>

    <script>
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('togglePasswordIcon');
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleIcon.classList.toggle('bi-eye', !isPassword);
        toggleIcon.classList.toggle('bi-eye-slash', isPassword);
      });
    </script>
  </body>
</html>
